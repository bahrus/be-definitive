<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <script nomodule id=Person be-scoped>
            ({})
        </script>
        <thead><th>Name</th><th>SSN Number</th></thead>
        <tbody>
            <tr itemscope=Person id=temp>
                <td itemprop=name>Burt</td>
                <td itemprop=ssn>123-45-6789</td>
            </tr>
            <template data-ld='{"@type": "Person", "name": "Sally", "ssn": "987-65-4321"}' src=#temp></template>
            <template data-ld='{"@type": "Person", "name": "Anne", "ssn": "135-79-2468"}' src=#temp></template>
        </tbody>
    </table>
</body>
</html>
